<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" width="980" height="220" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
